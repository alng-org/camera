<!DOCTYPE html>
<head>
    <meta name="viewport" content="
    width=device-width
    height=device-height
    initial-scale=1.0
    minimum-scale=1.0
    maximum-scale=1.0
    user-scalable=no">
    <script>


        function boot(left,right,mleft,mright,canvas,info){
            if(
                navigator.language === `zh-CN`
            ){
                //简体中文
                info.innerText = `\
1、在任意 A 点按住取景器
2、水平移动手机至 B 点（B 为异于 A 的首个位置）
3、最后在 C 点松手
4、若 B 与 C 位于 A 的同侧：
   保存照片
否则：
   取消
>>> 点击任意位置继续`;
            }else{
                //Global
                info.innerText =`\
1. Press viewfinder at any point A
2. Move phone horizontally to B (the first point different than A)
3. Finally release at C
4. If B and C are on the same side of A:
   Save the photo
Otherwise:
   Cancel
>>> Press Any Where to Continue
`;
            }
            document.body.addEventListener(
                "click",
                (e) => {
                    init(left,right,mleft,mright,canvas,info);
                },
                {
                    once: true
                }
            );
        }

        let INFO = Object.freeze(
            {
                UPTO: t => `Ʌ`,
                DOWNTO: t => `V`,
                CAPTURING: t => `O`,
                CAPTURED: t => t
            }
        );
        function update_info(info,left,right){
            info.innerText = `${left('>')} _ ${right('<')}`;
        }

        function init(left,right,mleft,mright,canvas,info){ 
            document.body.requestFullscreen().then(
            () => {
                return navigator.mediaDevices.getUserMedia(
                    {
                        audio:false,
                        video:{
                            width:{
                                ideal:3840
                            },
                            height:{
                                ideal:2160
                            },
                            facingMode:{
                                exact:"environment"
                            }
                        }
                     }
                 );
            }
        ).then(
                (stream) => {
                    maxsize_stream(stream);
                    
                    left.srcObject = stream;
                    right.srcObject = stream;

                    update_info(info,INFO.CAPTURING,INFO.CAPTURING);

                    let fabstract = (begin_event,move_event,end_event) => {
                        let X = (event) => event?.changedTouches?.[0].clientX ?? event.clientX;
                        let Y = (event) => event?.changedTouches?.[0].clientY ?? event.clientY;
                        right.addEventListener(
                            begin_event,
                            (begin) => {
                                right.addEventListener(
                                    move_event,
                                    (move) =>{
                                        let dx = X(move) - X(begin);
                                        let cabstract = (first,second,notice_info) => {
                                            before_grab(stream,canvas,mleft,mright);
                                            let await_draw_first = grab(stream,canvas,first);
                                            let pmove = (move_p) =>{
                                                let dy = Y(move_p) - Y(begin);
                                                let eps = 10;
                                                if(dy < -eps){
                                                    //device down
                                                    notice_info(INFO.UPTO);
                                                }else if(dy > eps){
                                                    //device up
                                                    notice_info(INFO.DOWNTO);
                                                }else{
                                                    notice_info(INFO.CAPTURING);
                                                }
                                            };
                                            right.addEventListener(
                                                move_event,
                                                pmove
                                            );
                                            right.addEventListener(
                                                end_event,
                                                (end) => {
                                                    right.removeEventListener(
                                                        move_event,
                                                        pmove
                                                    );
                                                    notice_info(INFO.CAPTURED);
                                                    let dX = X(end) - X(begin);
                                                    if(dX * dx > 0){
                                                        //same direction
                                                        grab(stream,canvas,second,await_draw_first).then(
                                                            (_) => {
                                                                saved_img(canvas);
                                                                after_grab(first,second,mleft,mright);
                                                            }
                                                        );
                                                    }else{
                                                        //cancel saved
                                                        await_draw_first.then(
                                                            (_) => {
                                                                after_grab(first,second,mleft,mright);
                                                            }
                                                        );  
                                                    }
                                                },
                                                {
                                                    once:true
                                                }
                                            );
                                        };
                                        if(dx < 0){
                                            //left first
                                            cabstract(left,right,(foo) => update_info(info,INFO.CAPTURED,foo));
                                        }else if(dx > 0){
                                            //right first
                                            cabstract(right,left,(foo) => update_info(info,foo,INFO.CAPTURED));
                                        }else{
                                            //cancel grab
                                        }
                                    },
                                    {
                                        once : true
                                    }
                                );
                            }
                        );
                    };
                    fabstract("mousedown","mousemove","mouseup");
                    fabstract("touchstart","touchmove","touchend");
                }
            ).catch(
                (err) => {
                    alert(`Catch the Fatal Error:\n${err}`);
                }
            );

        }

        function maxsize_stream(stream){
            let track = stream.getVideoTracks()[0];
            let cap = track.getCapabilities();
            let cwidth = cap.width?.max;
            let cheight = cap.height?.max;
            let czoom = cap.zoom?.min;
            if(
                cwidth !== undefined &&
                cheight !== undefined &&
                czoom !== undefined
            ){
                track.applyConstraints(
                    {
                        width: cwidth,
                        height: cheight
                    }
                );
                track.applyConstraints(
                    {
                        advanced: [
                            {
                                zoom: czoom,
                                whiteBalanceMode: "continuous",
                                exposureMode: "continuous",
                                focusMode: "continuous",
                                resizeMode: "none"
                            }
                        ]
                    }
                );
            }else{
                //PASS
            }
        }
        
        function original(mleft,mright){
            mleft.setAttribute(
                "values",
                color_matrix(
                    color_vec(1,0,0,0,0),
                    color_vec(0,1,0,0,0),
                    color_vec(0,0,1,0,0),
                    color_vec(0,0,0,1,0)
                )
            );
            mright.setAttribute(
                "values",
                color_matrix(
                    color_vec(1,0,0,0,0),
                    color_vec(0,1,0,0,0),
                    color_vec(0,0,1,0,0),
                    color_vec(0,0,0,1,0)
                )
            );
        }
        
        function dubois(mleft,mright){
            //the matrix of the Dubois Anaglyph
            mleft.setAttribute(
                "values",
                color_matrix(
                    color_vec(0.456,0.5,0.176,0,0),
                    color_vec(0,0,0,0,0),
                    color_vec(0,0,0,0,0),
                    color_vec(0,0,0,1,0)
                )
            );
            mright.setAttribute(
                "values",
                color_matrix(
                    color_vec(-0.043,-0.088,-0.002,0,0),
                    color_vec(0.378,0.734,-0.018,0,0),
                    color_vec(-0.072,0.212,1.131,0,-0.1),
                    color_vec(0,0,0,1,0)
                )
            );
        }

        function color_vec(red_percent,green_percent,blue_percent,alpha_percent,offset){
            return `${red_percent} ${green_percent} ${blue_percent} ${alpha_percent} ${offset}`;
        }

        function color_matrix(new_red,new_green,new_blue,new_alpha){
            return `${new_red} ${new_green} ${new_blue} ${new_alpha}`;
        }
        

        function before_grab(stream,canvas,mleft,mright){
            let track = stream.getVideoTracks()[0];
            canvas.width = track.getSettings().width;
            canvas.height = track.getSettings().height;
            dubois(mleft,mright);
        }

        function transform_mix(mix){
            if(mix === "normal"){
                return "source-over";
            }else{
                return mix;
            }
        }

        function grab(stream,canvas,video,before = Promise.resolve(null)){
            let track = stream.getVideoTracks()[0];
            let imgc = new ImageCapture(track);
            let ctx = canvas.getContext("2d");
            let filter = window.getComputedStyle(video).filter;
            let mix_mode =  transform_mix(window.getComputedStyle(video).mixBlendMode);
            let opacity = window.getComputedStyle(video).opacity;
            return imgc.grabFrame().then(
                    (img) => {
                        video.pause();
                        return before.then(
                            (_) => {
                                ctx.filter = filter;
                                ctx.globalCompositeOperation = mix_mode;
                                ctx.globalAlpha = opacity;
                                ctx.drawImage(img, 0, 0);
                                img.close();
                                return null;
                            }
                        );
                    }
                ).catch(
                    (err) => {
                        alert(`Cannot Capture an Image from the Camera, due to:\n${err}`);
                    }
                );
        }

        function after_grab(left,right,mleft,mright){
            left.play().then(
                () => {
                    right.play().then(
                        () => {
                            //ensure left and right is playing
                            original(mleft,mright);
                            update_info(info,INFO.CAPTURING,INFO.CAPTURING);
                        }
                    );
                }
            );
        }

        function saved_img(canvas){
            let img = canvas.toDataURL("image/png",1.0);
            let a = document.createElement("a");
            a.href = img;
            a.download = `3D_Image [${new Date().getTime()}]`;
            a.click();
        }
    
    
    
    </script>
    <style>
        video{
            width:100dvw;
            height:100dvh;
            object-fit: contain;
        }
        video,#info{
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
        #left{
            z-index: 1;
            filter: url(#fleft);
            opacity: 1;
            mix-blend-mode: normal;
        }
        #right{
            z-index: 2;
            filter: url(#fright);
            opacity: 0.5;
            mix-blend-mode: screen;
        }
        #info{
            z-index:3;
            pointer-events: none;
            color: white;
            opacity: 0.5;
            font-family: emoji;
        }
        body{
            background-color: black;
        }
        svg,canvas{
            display: none;
        }
    </style>
</head>
<body 
onload="boot(
    document.getElementById('left'),
    document.getElementById('right'),
    document.getElementById('mleft'),
    document.getElementById('mright'),
    document.getElementById('img_canvas'),
    document.getElementById('info')
    )">
    <video id="left" autoplay></video>
    <div id="info"></div>
    <video id="right" autoplay></video>
    <canvas id="img_canvas"></canvas>
    <svg>
        <defs>
            <filter id="fleft">
                <feColorMatrix type="matrix" id= "mleft"/>                
            </filter>
            <filter id="fright">
                <feColorMatrix type="matrix" id = "mright"/>                
            </filter>
        </defs>
    </svg>

</body>
