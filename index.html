<!DOCTYPE html>
<head>
    <meta name="viewport" content="
    width=device-width
    height=device-height
    initial-scale=1.0
    minimum-scale=1.0
    maximum-scale=1.0
    user-scalable=no">
    <script>
        
        function boot(canvas,info){
            if(
                navigator.language === `zh-CN`
            ){
                //简体中文
                info.innerText = `开发中...`;
            }else{
                //Global
                info.innerText =`Devloping...`;
            }
            document.body.addEventListener(
                "click",
                (e) => {
                    init(canvas,info);
                },
                {
                    once: true
                }
            );
        }

        let INFO = Object.freeze(
            {
                UPTO: t => `Ʌ`,
                DOWNTO: t => `V`,
                CAPTURING: t => `O`,
                CAPTURED: t => t
            }
        );
        function update_info(info,left,right){
            info.innerText = `${left('>')} _ ${right('<')}`;
        }

        function init(canvas,info){ 
            document.body.requestFullscreen().then(
            () => {
                return navigator.mediaDevices.getUserMedia(
                    {
                        audio:false,
                        video:{
                            width:{
                                ideal:3840
                            },
                            height:{
                                ideal:2160
                            },
                            facingMode:{
                                exact:"environment"
                            }
                        }
                     }
                 );
            }
        ).then(
                (stream) => maxsize_stream(stream)
        ).then(
                (tools) => {
                    //todo
                }
        ).catch(
                (err) => {
                    alert(`Catch the Fatal Error:\n${err}`);
                }
            );

        }

        function maxsize_stream(stream,canvas){
            let track = stream.getVideoTracks()[0];
            let cap = track.getCapabilities();
            let cwidth = cap.width?.max;
            let cheight = cap.height?.max;
            let czoom = cap.zoom?.min;
            if(
                cwidth !== undefined &&
                cheight !== undefined &&
                czoom !== undefined
            ){
                return track.applyConstraints(
                    {
                        width: cwidth,
                        height: cheight
                    }
                ).then(
                    () => 
                        track.applyConstraints(
                            {
                                advanced: [
                                    {
                                        zoom: czoom,
                                        whiteBalanceMode: "continuous",
                                        exposureMode: "continuous",
                                        focusMode: "continuous",
                                        resizeMode: "none"
                                    }
                                ]
                            }
                        )
                ).then(
                    () => {
                        let imgc = new ImageCapture(track);
                        return {
                            gFrame: (f)  => imgc.grabFrame().then(f).catch(
                                (err) => {
                                    alert(`Cannot Capture an Image from the Camera, due to:\n${err}`);
                                }
                            ),
                            preview_2d: 
                                (img) => direct.draw(
                                    cwidth,cheight
                                )(canvas,img),
                            preview_3d: 
                                (left,right) => dubois.anaglyph(
                                    cwidth,cheight
                                )(canvas,left,right)
                        };
                    }
                );     
            }else{
                return Promise.reject(
                    "Failed apply constraints to the video stream from camera"
                );
            }
        }

        function saved_img(canvas){
            let img = canvas.toDataURL("image/png",1.0);
            let a = document.createElement("a");
            a.href = img;
            a.download = `3D_Image [${new Date().getTime()}]`;
            a.click();
        }
        
    </script>
    <script src="webgl2.js"></script>
    <style>
        canvas,#info{
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
        canvas{
            z-index:1;
        }
        #info{
            z-index:2;
            pointer-events: none;
            color: white;
            opacity: 0.5;
            font-family: emoji;
            font-weight:bold;
            font-size:1.5rem;
        }
        body{
            background-color: black;
            width:100dvw;
            height:100dvh;
        }
    </style>
</head>
<body 
onload="boot(
    document.getElementById('img_canvas'),
    document.getElementById('info')
)">
    <div id="info"></div>
    <canvas id="img_canvas"></canvas>
</body>
