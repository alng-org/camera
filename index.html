<!DOCTYPE html>
<head>
    <meta name="viewport" content="
    width=device-width
    height=device-height
    initial-scale=1.0
    minimum-scale=1.0
    maximum-scale=1.0
    user-scalable=no">
    <script>

        function boot(left,right,mleft,mright,canvas,info){
            if(
                navigator.language === `zh-CN`
            ){
                //简体中文
                info.innerText = `开发中...`;
            }else{
                //Global
                info.innerText =`Devloping...`;
            }
            document.body.addEventListener(
                "click",
                (e) => {
                    init(left,right,mleft,mright,canvas,info);
                },
                {
                    once: true
                }
            );
        }

        let INFO = Object.freeze(
            {
                UPTO: t => `Ʌ`,
                DOWNTO: t => `V`,
                CAPTURING: t => `O`,
                CAPTURED: t => t
            }
        );
        function update_info(info,left,right){
            info.innerText = `${left('>')} _ ${right('<')}`;
        }

        function init(left,right,mleft,mright,canvas,info){ 
            document.body.requestFullscreen().then(
            () => {
                return navigator.mediaDevices.getUserMedia(
                    {
                        audio:false,
                        video:{
                            width:{
                                ideal:3840
                            },
                            height:{
                                ideal:2160
                            },
                            facingMode:{
                                exact:"environment"
                            }
                        }
                     }
                 );
            }
        ).then(
                (stream) => {
                    maxsize_stream(stream);
                    
                    left.srcObject = stream;
                    right.srcObject = stream;

                    update_info(info,INFO.CAPTURING,INFO.CAPTURING);
                    document.body.addEventListener(
                        "click",
                        (e) => {
                            update_info(info,INFO.CAPTURED,INFO.CAPTURED);
                            
                            let first = right;
                            let second = left;
                            let vibrate_for_second = 80;
                            let delay_capture_second = 120;

                            
                            let img_obj = before_grab(stream,canvas,mleft,mright,first,second);
                            let await_draw_first = grab(stream,canvas,first,img_obj.first);
                            navigator.vibrate(vibrate_for_second);
                            setTimeout(
                                () => {
                                    grab(stream,canvas,second,img_obj.second, await_draw_first).then(
                                        (_) => {
                                            saved_img(canvas);
                                            after_grab(first,second,mleft,mright,info);
                                        }
                                    )
                                },
                                delay_capture_second
                            );
                        }
                    );
                }
            ).catch(
                (err) => {
                    alert(`Catch the Fatal Error:\n${err}`);
                }
            );

        }

        function maxsize_stream(stream){
            let track = stream.getVideoTracks()[0];
            let cap = track.getCapabilities();
            let cwidth = cap.width?.max;
            let cheight = cap.height?.max;
            let czoom = cap.zoom?.min;
            if(
                cwidth !== undefined &&
                cheight !== undefined &&
                czoom !== undefined
            ){
                track.applyConstraints(
                    {
                        width: cwidth,
                        height: cheight
                    }
                );
                track.applyConstraints(
                    {
                        advanced: [
                            {
                                zoom: czoom,
                                whiteBalanceMode: "continuous",
                                exposureMode: "continuous",
                                focusMode: "continuous",
                                resizeMode: "none"
                            }
                        ]
                    }
                );
            }else{
                //PASS
            }
        }
        
        function original(mleft,mright){
            mleft.setAttribute(
                "values",
                color_matrix(
                    color_vec(1,0,0,0,0),
                    color_vec(0,1,0,0,0),
                    color_vec(0,0,1,0,0),
                    color_vec(0,0,0,1,0)
                )
            );
            mright.setAttribute(
                "values",
                color_matrix(
                    color_vec(1,0,0,0,0),
                    color_vec(0,1,0,0,0),
                    color_vec(0,0,1,0,0),
                    color_vec(0,0,0,1,0)
                )
            );
        }
        
        function dubois(mleft,mright){
            //the matrix of the Dubois Anaglyph
            mleft.setAttribute(
                "values",
                color_matrix(
                    color_vec(0.456,0.5,0.176,0,0),
                    color_vec(0,0,0,0,0),
                    color_vec(0,0,0,0,0),
                    color_vec(0,0,0,1,0)
                )
            );
            mright.setAttribute(
                "values",
                color_matrix(
                    color_vec(-0.043,-0.088,-0.002,0,0),
                    color_vec(0.378,0.734,-0.018,0,0),
                    color_vec(-0.072,0.212,1.131,0,-0.1),
                    color_vec(0,0,0,1,0)
                )
            );
        }

        function color_vec(red_percent,green_percent,blue_percent,alpha_percent,offset){
            return `${red_percent} ${green_percent} ${blue_percent} ${alpha_percent} ${offset}`;
        }

        function color_matrix(new_red,new_green,new_blue,new_alpha){
            return `${new_red} ${new_green} ${new_blue} ${new_alpha}`;
        }

        function update_css(e,z_index,opacity,mix_blend_mode){
            e.style.zIndex = z_index;
            e.style.opacity = opacity;
            e.style.mixBlendMode = mix_blend_mode;
            return (img) => {
                return {
                    //necessary attributes
                    opacity: opacity,
                    mix_blend_mode: mix_blend_mode,
                    filter: window.getComputedStyle(e).filter,
                    // the image data
                    img: img
                };
            };
        }
        function before_grab(stream,canvas,mleft,mright,first,second){
            let track = stream.getVideoTracks()[0];
            canvas.width = track.getSettings().width;
            canvas.height = track.getSettings().height;
            dubois(mleft,mright);
            return {
                first: update_css(first,1,1,"normal"),
                second: update_css(second,2,0.5,"screen")
            };
            
        }

        function transform_mix(mix){
            if(mix === "normal"){
                return "source-over";
            }else{
                return mix;
            }
        }

        function grab(stream,canvas,video,img_lambda,before = Promise.resolve(null)){
            let track = stream.getVideoTracks()[0];
            let imgc = new ImageCapture(track);
            let ctx = canvas.getContext("2d");
            return imgc.grabFrame().then(
                    (img) => {
                        video.pause();
                        let img_value = img_lambda(img);
                        return before.then(
                            (_) => {
                                ctx.filter = img_value.filter;
                                ctx.globalCompositeOperation = transform_mix(img_value.mix_blend_mode);
                                ctx.globalAlpha = img_value.opacity;
                                ctx.drawImage(img_value.img, 0, 0);
                                img_value.img.close();
                                return null;
                            }
                        );
                    }
                ).catch(
                    (err) => {
                        alert(`Cannot Capture an Image from the Camera, due to:\n${err}`);
                    }
                );
        }

        function after_grab(left,right,mleft,mright,info){
            left.play().then(
                () => {
                    right.play().then(
                        () => {
                            //ensure left and right is playing
                            original(mleft,mright);
                            update_info(info,INFO.CAPTURING,INFO.CAPTURING);
                        }
                    );
                }
            );
        }

        function saved_img(canvas){
            let img = canvas.toDataURL("image/png",1.0);
            let a = document.createElement("a");
            a.href = img;
            a.download = `3D_Image [${new Date().getTime()}]`;
            a.click();
        }
        
    </script>
    <style>
        video{
            width:100dvw;
            height:100dvh;
            object-fit: contain;
            pointer-events: none;
        }
        video,#info{
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
        #left{
            z-index: 1;
            filter: url(#fleft);
            opacity: 1;
            mix-blend-mode: normal;
        }
        #right{
            z-index: 2;
            filter: url(#fright);
            opacity: 0.5;
            mix-blend-mode: screen;
        }
        #info{
            z-index:3;
            pointer-events: none;
            color: white;
            opacity: 0.5;
            font-family: emoji;
            font-weight:bold;
            font-size:1.5rem;
        }
        body{
            background-color: black;
            width:100dvw;
            height:100dvh;
        }
        svg,canvas{
            display: none;
        }
    </style>
</head>
<body 
onload="boot(
    document.getElementById('left'),
    document.getElementById('right'),
    document.getElementById('mleft'),
    document.getElementById('mright'),
    document.getElementById('img_canvas'),
    document.getElementById('info')
    )">
    <video id="left" autoplay></video>
    <div id="info"></div>
    <video id="right" autoplay></video>
    <canvas id="img_canvas"></canvas>
    <svg>
        <defs>
            <filter id="fleft">
                <feColorMatrix type="matrix" id= "mleft"/>                
            </filter>
            <filter id="fright">
                <feColorMatrix type="matrix" id = "mright"/>                
            </filter>
        </defs>
    </svg>

</body>
