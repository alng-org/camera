<!DOCTYPE html>
<head>
    <meta name="viewport" content="
    width=device-width
    height=device-height
    initial-scale=1.0
    minimum-scale=1.0
    maximum-scale=1.0
    user-scalable=no">
    <script>

        let INFO = Object.freeze(
            {
                CAPTURING: t => `O`,
                CAPTURED: t => t
            }
        );
        function update_info(info,left,right){
            info.innerText = `${left('>')} _ ${right('<')}`;
        }
        function replace_info(info,new_info){
            let ret = info.innerText;
            info.innerText = new_info;
            return ret;
        }

        class rAF{
            #img = null;
            #tools;
            #finfo;
            #handle;
            #fclick;
            #capture;
            #canvas;
            
            constructor(tools,info,canvas){
                this.#tools = tools;
                this.#finfo = (left,right) => 
                    update_info(info,left,right);
                this.#canvas = canvas;
                
                this.#update(
                    INFO.CAPTURING,
                    INFO.CAPTURING,
                    rAF.#original,
                    rAF.#abstract_fclick(
                        this,
                        rAF.#capture_left,
                        rAF.#capture_right
                    )
                );
                
                this.#capture = rAF.#no_capture;
                rAF.#render(this);
                
                document.body.addEventListener(
                    "click",
                    (e) => this.#fclick(e)
                );  
                screen.orientation.addEventListener(
                    "change",
                    (e) => rAF.#capture_cancel(this)
                );
                
            }

            #replace(img){
                this.#tools.horizon_expect_locked(img !== null);
                this.#img?.close();
                this.#img = img;
            }

            #update(
                left,
                right,
                handle,
                fclick
            ){
                this.#handle = handle;
                this.#fclick = fclick;
                this.#finfo(left,right);
            }
            
            static #original(ref){
                ref.#tools.gFrame(
                    (img) => {
                        ref.#tools.preview_2d(img);
                        ref.#tools.horizon_track();
                        ref.#capture(ref,img);
                        rAF.#next_render(ref);
                    }
                );
            }

            static #draw_left_first(left){
                return (ref) => {
                    ref.#tools.gFrame(
                        (right) => {
                            ref.#tools
                               .preview_3d(
                                   left,
                                   right
                               );
                            ref.#tools.horizon_track();
                            ref.#capture(ref,right);
                            rAF.#next_render(ref);
                        }
                    );
                }
            }

            static #draw_right_first(right){
                return (ref) => {
                    ref.#tools.gFrame(
                        (left) => {
                            ref.#tools
                               .preview_3d(
                                   left,
                                   right
                               );
                            ref.#tools.horizon_track();
                            ref.#capture(ref,left);
                            rAF.#next_render(ref);
                        }
                    );
                }
            }

            static #snooze(ref){
                //PASS
            }

            static #abstract_fclick(ref,left,right){
                return ({clientX}) => {
                    let half = document.documentElement.clientWidth / 2;
                    if(clientX < half){
                        left(ref);
                    }else if(clientX > half){
                        right(ref);
                    }else{
                        //PASS
                    }
                };
            }
            
            static #next_render(ref){
                requestAnimationFrame(
                    () => ref.#handle(ref)
                );
            }
            static #render(ref){
                ref.#handle(ref);
            }

            static #no_capture(ref,img = null){
                img?.close();
            }
            
            static #capture_left(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        if(img === null){
                            //PASS
                        }else{
                            ref.#replace(img);
                            ref.#update(
                                INFO.CAPTURED,
                                INFO.CAPTURING,
                                rAF.#draw_left_first(
                                    ref.#img
                                ),
                                rAF.#abstract_fclick(
                                    ref,
                                    rAF.#capture_cancel,
                                    rAF.#capture_other
                                )
                            );
                        }
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            static #capture_right(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        if(img === null){
                            //PASS
                        }else{
                            ref.#replace(img);
                            ref.#update(
                                INFO.CAPTURING,
                                INFO.CAPTURED,
                                rAF.#draw_right_first(
                                    ref.#img
                                ),
                                rAF.#abstract_fclick(
                                    ref,
                                    rAF.#capture_other,
                                    rAF.#capture_cancel
                                )
                            );
                        }
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            static #capture_other(ref){
                if(
                    ref.#capture !== rAF.#no_capture ||
                    ref.#img === null
                ){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        ref.#replace(null);
                        img?.close();
                        ref.#update(
                            INFO.CAPTURED,
                            INFO.CAPTURED,
                            rAF.#snooze,
                            (e) =>{ /*PASS*/ }
                        );
                        ref.#canvas.toBlob(
                            (blob) => {
                                if(blob !== null){
                                    rAF.#download_file(blob);
                                }else{
                                    alert("PNG Export Error");
                                }
                                ref.#update(
                                    INFO.CAPTURING,
                                    INFO.CAPTURING,
                                    rAF.#original,
                                    rAF.#abstract_fclick(
                                        ref,
                                        rAF.#capture_left,
                                        rAF.#capture_right
                                    )
                                );
                                
                                ref.#capture = rAF.#no_capture;
                                rAF.#render(ref);
                            },
                            "image/png"
                        );
                    };
                }
            }

            static #capture_cancel(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        ref.#replace(null);
                        img?.close();
                        ref.#update(
                            INFO.CAPTURING,
                            INFO.CAPTURING,
                            rAF.#original,
                            rAF.#abstract_fclick(
                                ref,
                                rAF.#capture_left,
                                rAF.#capture_right
                            )
                        );
                        
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }
            
            static #download_file(blob){
                let name = 
                    `3D_Image [${new Date().getTime()}].png`;
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = name;
                a.click();
                URL.revokeObjectURL(url);
            }
            
        }

        function init(canvas,info,horizon,help){
            navigator.mediaDevices.getUserMedia(
                {
                    audio:false,
                    video:{
                        width:{ ideal:3840 },
                        height:{ ideal:2160 },
                        facingMode:{ exact:"environment" }
                    }
                }
            ).then(
                (stream) => maxsize_stream(stream,canvas,horizon)
        ).then(
                (tools) => {
                    let c = new rAF(tools,info,canvas);

                    document.body.addEventListener(
                        "click",
                        (e) => keep_wake()
                    );
                    
                    screen.orientation.addEventListener(
                        "change",
                        (e) => keep_wake()
                    );
                    
                    document.body.addEventListener(
                        "visibilitychange",
                        (e) => {
                            if(document.visibilityState === "visible"){
                                keep_wake();
                            }else{
                                //PASS
                            }
                        }
                    );

                    let fhelp = (start,end) => {
                        help.addEventListener(
                            start,
                            (e) => {
                                e.preventDefault();
                                tools.horizon_unable_show();
                                let old_info = replace_info(
                                    info,
`\
click left first to capture left,
then click right to capture right and save photo,
or click left to cancel.
click right first to capture right,
then click left to capture left and save photo,
or click right to cancel.`
                                );
                                help.addEventListener(
                                    end,
                                    (e) => {
                                        replace_info(info,old_info);
                                        tools.horizon_enable_show();
                                    },
                                    { once:true }
                                );
                            }
                        );
                    };

                    fhelp("mousedown","mouseup");
                    fhelp("touchstart","touchend");
                    
                }
        ).catch(
                (err) => {
                    alert(`Catch the Fatal Error:\n${err}`);
                }
            );

        }

        function maxsize_stream(stream,canvas,horizon){
            let track = stream.getVideoTracks()[0];
            let cap = track.getCapabilities();
            let cwidth = cap.width?.max;
            let cheight = cap.height?.max;
            let czoom = 1.0;
            if(
                cwidth !== undefined &&
                cheight !== undefined
            ){
                stream.getTracks().forEach(t => t.stop());
                
                return navigator.mediaDevices.getUserMedia(
                    {
                        audio:false,
                        video:{
                            width:{ exact: cwidth },
                            height:{ exact: cheight },
                            facingMode:{ exact:"environment" }
                        }
                    }
                ).then(
                    (stream_full) => {
                        let track_full = stream_full.getVideoTracks()[0];
                        return track_full.applyConstraints(
                            {
                                advanced: [{
                                    zoom: czoom,
                                    whiteBalanceMode: "continuous",
                                    exposureMode: "continuous",
                                    focusMode: "continuous"
                                }]
                            }
                        ).then(
                            () => gpu.of(canvas,cwidth,cheight)
                        ).then(
                            (render) => {
                                let imgc = new ImageCapture(track_full);
                                let draw_2d = direct.draw(render);
                                let draw_3d = dubois.anaglyph(render);
                                /* [Horizon Interface]
                                   Horizon.display_with(svg_element)
                                   create Horizon instance, associate display with svg_element
                                */
                                let horizon_proc = Horizon.display_with(horizon);
                                return {
                                    gFrame: (f)  => imgc.grabFrame().then(f).catch(
                                        (err) => {
                                            alert(`Cannot Capture an Image from the Camera, due to:\n${err}`);
                                        }
                                    ),
                                    preview_2d: draw_2d,
                                    preview_3d: draw_3d,
                                    /* [Horizon Interface]
                                       Horizon::expect_locked(expect_what)
                                       expect_what === true: locked horizon
                                       expect_what === false: unlocked horizon
                                       note: expect_what is bool
                                    */
                                    horizon_expect_locked: (expect_what) => horizon_proc.expect_locked(expect_what),
                                    /* [Horizon Interface]
                                       Horizon::track()
                                       track horizon, in render after draw each grabbed frame
                                    */
                                    horizon_track: () => horizon_proc.track(),
                                    /* [Horizon Interface]
                                       Horizon::unable_show()
                                       unable to show horizon, means hide horizon
                                    */
                                    horizon_unable_show: () => horizon_proc.unable_show(),
                                    /* [Horizon Interface]
                                       Horizon::enable_show()
                                       enable to show horizon, means show horizon if available
                                    */
                                    horizon_enable_show: () => horizon_proc.enable_show()
                                };
                            }
                        );
                    }
                );     
            }else{
                return Promise.reject(
                    "Failed apply constraints to the video stream from camera"
                );
            }
        }

        function keep_wake(){
            let type = screen.orientation?.type ?? "";
            if( type.startsWith("landscape") === true ){
                document.body.requestFullscreen();
            }else{
                document.exitFullscreen();
            }
            navigator.wakeLock
                .request('screen')
                .then(
                    (wake_lock) => wake_lock.addEventListener(
                        "release",
                        (e) => keep_wake(),
                        { once: true }
                    )
                );
        
        }

        function help(e){
            event.stopPropagation();
        }
        
    </script>
    <script src="gpu.js"></script>
    <script src="horizon.js"></script>
    <style>
        canvas,#info,#horizon{
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
        canvas{
            z-index:1;
            width:100dvw;
            height:100dvh;
            object-fit: contain;
        }
        #horizon{
            z-index:2;
            width:30dvw;
            height:30dvh;
        }
        #info,#horizon{
            pointer-events: none;
            color: white;
            opacity: 0.5;
        }  
        #help{
            position:fixed;
            right: 5%;
            bottom: 5%;
        }
        #info,#help{
            z-index:3;
            font-family: emoji;
            font-weight:bold;
            font-size:1.5rem;
        }
        body{
            background-color: black;
            width:100dvw;
            height:100dvh;
        }
    </style>
</head>
<body 
onload="init(
    document.getElementById('img_canvas'),
    document.getElementById('info'),
    document.getElementById('horizon'),
    document.getElementById('help')
)">
    <div id="info"></div>
    <svg id="horizon" 
         viewBox="0 0 100 100" 
         preserveAspectRatio="xMidYMid meet">
    </svg>
    <canvas id="img_canvas"></canvas>
    <div id="help">❔</div>
</body>
