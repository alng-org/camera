<!DOCTYPE html>
<head>
    <meta name="viewport" content="
    width=device-width
    height=device-height
    initial-scale=1.0
    minimum-scale=1.0
    maximum-scale=1.0
    user-scalable=no">
    <script>
        
        function boot(canvas,info){
            if(
                navigator.language === `zh-CN`
            ){
                //简体中文
                info.innerText = `开发中...`;
            }else{
                //Global
                info.innerText =`Devloping...`;
            }
            document.body.addEventListener(
                "click",
                (e) => {
                    init(canvas,info);
                },
                {
                    once: true
                }
            );
        }

        let INFO = Object.freeze(
            {
                UPTO: t => `Ʌ`,
                DOWNTO: t => `V`,
                CAPTURING: t => `O`,
                CAPTURED: t => t
            }
        );
        function update_info(info,left,right){
            info.innerText = `${left('>')} _ ${right('<')}`;
        }



        class rAF{
            #img = null;
            #tools;
            #handle = rAF.#original;
            #capture;
            
            constructor(tools){
                this.#tools = tools;
            }

            #replace(img){
                this.#img?.close();
                this.#img = img;
            }
            
            static #original(ref){
                ref.#tools.gFrame(
                    (img) => {
                        ref.#tools.preview_2d(img);
                        ref.#capture(ref,img);
                        rAF.#next_render(ref);
                    }
                );
            }

            static #draw_left_first(left){
                return (ref) => {
                    ref.#tools.gFrame(
                        (right) => {
                            ref.#tools
                               .preview_3d
                               .draw_left_first(
                                   left,
                                   right
                               );
                            ref.#capture(ref,right);
                            rAF.#next_render(ref);
                        }
                    );
                }
            }

            static #draw_right_first(right){
                return (ref) => {
                    ref.#tools.gFrame(
                        (left) => {
                            ref.#tools
                               .preview_3d
                               .draw_right_first(
                                   left,
                                   right
                               );
                            ref.#capture(ref,left);
                            rAF.#next_render(ref);
                        }
                    );
                }
            }

            static #snooze(ref){
                ref.#capture(ref);
                rAF.#next_render(ref);
            }
            
            static #next_render(ref){
                requestAnimationFrame(
                    () => rAF.render(ref)
                );
            }
            static render(ref){
                ref.#handle(ref);
            }

            static #no_capture(ref,img = null){
                img?.close();
            }
            
            static capture_left(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        if(img === null){
                            //PASS
                        }else{
                            ref.#replace(img);
                            ref.#handle = 
                                rAF.#draw_left_first(
                                    ref.#img
                                );
                        }
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            static capture_right(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        if(img === null){
                            //PASS
                        }else{
                            ref.#replace(img);
                            ref.#handle = 
                                rAF.#draw_right_first(
                                    ref.#img
                                );
                        }
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            static capture_other(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        ref.#replace(null);
                        img?.close();
                        ref.#handle = rAF.#snooze;
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }
            
        }

        function init(canvas,info){ 
            document.body.requestFullscreen().then(
            () => {
                return navigator.mediaDevices.getUserMedia(
                    {
                        audio:false,
                        video:{
                            width:{
                                ideal:3840
                            },
                            height:{
                               ideal:2160
                            },
                            facingMode:{
                                exact:"environment"
                            }
                        }
                     }
                 );
            }
        ).then(
                (stream) => maxsize_stream(stream,canvas)
        ).then(
                (tools) => {
                    let c = new rAF(tools);
                    rAF.render(c);

                    document.body.addEventListener(
                        "click",
                        (e) => {
                            alert("test");
                        }
                    );

                    
                }
        ).catch(
                (err) => {
                    alert(`Catch the Fatal Error:\n${err}`);
                }
            );

        }

        function maxsize_stream(stream,canvas){
            let track = stream.getVideoTracks()[0];
            let cap = track.getCapabilities();
            let cwidth = cap.width?.max;
            let cheight = cap.height?.max;
            let czoom = cap.zoom?.min;
            if(
                cwidth !== undefined &&
                cheight !== undefined &&
                czoom !== undefined
            ){
                stream.getTracks().forEach(t => t.stop());
                
                return navigator.mediaDevices.getUserMedia(
                    {
                        audio:false,
                        video:{
                            width:{
                                exact: cwidth
                            },
                            height:{
                               exact: cheight
                            },
                            facingMode:{
                                exact:"environment"
                            }
                        }
                    }
                ).then(
                    (stream_full) => {
                        let track_full = stream_full.getVideoTracks()[0];
                        return track_full.applyConstraints(
                            {
                                advanced: [{
                                    zoom: czoom,
                                    whiteBalanceMode: "continuous",
                                    exposureMode: "continuous",
                                    focusMode: "continuous"
                                }]
                            }
                        ).then(
                            () => {
                                let imgc = new ImageCapture(track_full);
                                let draw_2d = direct.draw(cwidth,cheight);
                                let draw_3d = dubois.anaglyph(cwidth,cheight);
                                return {
                                    gFrame: (f)  => imgc.grabFrame().then(f).catch(
                                        (err) => {
                                            alert(`Cannot Capture an Image from the Camera, due to:\n${err}`);
                                        }
                                    ),
                                    preview_2d: 
                                        (img) => draw_2d(canvas,img),
                                    preview_3d: 
                                        draw_3d(canvas)
                                };
                            }
                        );
                    }
                );     
            }else{
                return Promise.reject(
                    "Failed apply constraints to the video stream from camera"
                );
            }
        }

        function saved_img(canvas){
            let img = canvas.toDataURL("image/png",1.0);
            let a = document.createElement("a");
            a.href = img;
            a.download = `3D_Image [${new Date().getTime()}]`;
            a.click();
        }
        
    </script>
    <script src="webgl2.js"></script>
    <style>
        canvas,#info{
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
        canvas{
            z-index:1;
            width:100dvw;
            height:100dvh;
            object-fit: contain;
        }
        #info{
            z-index:2;
            pointer-events: none;
            color: white;
            opacity: 0.5;
            font-family: emoji;
            font-weight:bold;
            font-size:1.5rem;
        }
        body{
            background-color: black;
            width:100dvw;
            height:100dvh;
        }
    </style>
</head>
<body 
onload="boot(
    document.getElementById('img_canvas'),
    document.getElementById('info')
)">
    <div id="info"></div>
    <canvas id="img_canvas"></canvas>
</body>
