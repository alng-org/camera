<!DOCTYPE html>
<head>
    <meta name="viewport" content="
    width=device-width
    height=device-height
    initial-scale=1.0
    minimum-scale=1.0
    maximum-scale=1.0
    user-scalable=no">
    <script>
        
        function boot(canvas,info){
            if(
                navigator.language === `zh-CN`
            ){
                //简体中文
                info.innerText = `开发中...`;
            }else{
                //Global
                info.innerText =`Devloping...`;
            }
            document.body.addEventListener(
                "click",
                (e) => {
                    init(canvas,info);
                },
                {
                    once: true
                }
            );
        }

        let INFO = Object.freeze(
            {
                UPTO: t => `Ʌ`,
                DOWNTO: t => `V`,
                CAPTURING: t => `O`,
                CAPTURED: t => t
            }
        );
        function update_info(info,left,right){
            info.innerText = `${left('>')} _ ${right('<')}`;
        }



        class rAF{
            #img = null;
            #tools;
            #finfo
            #handle = rAF.#original;
            #capture = rAF.#no_capture;
            
            constructor(tools,info){
                this.#tools = tools;
                this.#finfo = (left,right) => 
                    update_info(info,left,right);
                this.#finfo(INFO.CAPTURING,INFO.CAPTURING);
                rAF.#render(this);
            }

            #replace(img){
                this.#img?.close();
                this.#img = img;
            }
            
            static #original(ref){
                ref.#tools.gFrame(
                    (img) => {
                        ref.#tools.preview_2d(img);
                        ref.#capture(ref,img);
                        rAF.#next_render(ref);
                    }
                );
            }

            static #draw_left_first(left){
                return (ref) => {
                    ref.#tools.gFrame(
                        (right) => {
                            ref.#tools
                               .preview_3d(
                                   left,
                                   right
                               );
                            ref.#capture(ref,right);
                            rAF.#next_render(ref);
                        }
                    );
                }
            }

            static #draw_right_first(right){
                return (ref) => {
                    ref.#tools.gFrame(
                        (left) => {
                            ref.#tools
                               .preview_3d(
                                   left,
                                   right
                               );
                            ref.#capture(ref,left);
                            rAF.#next_render(ref);
                        }
                    );
                }
            }

            static #snooze(ref){
                //PASS
            }
            
            static #next_render(ref){
                requestAnimationFrame(
                    () => ref.#handle(ref)
                );
            }
            static #render(ref){
                ref.#handle(ref);
            }

            static #no_capture(ref,img = null){
                img?.close();
            }
            
            static capture_left(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        if(img === null){
                            //PASS
                        }else{
                            ref.#replace(img);
                            ref.#handle = 
                                rAF.#draw_left_first(
                                    ref.#img
                                );
                            ref.#finfo(INFO.CAPTURED,INFO.CAPTURING);
                        }
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            static capture_right(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        if(img === null){
                            //PASS
                        }else{
                            ref.#replace(img);
                            ref.#handle = 
                                rAF.#draw_right_first(
                                    ref.#img
                                );
                            ref.#finfo(INFO.CAPTURING,INFO.CAPTURED);
                        }
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            static capture_other(ref,canvas){
                if(
                    ref.#capture !== rAF.#no_capture &&
                    ref.#img !== null
                ){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        ref.#replace(null);
                        img?.close();
                        ref.#handle = rAF.#snooze;
                        ref.#finfo(INFO.CAPTURED,INFO.CAPTURED);
                        canvas.toBlob(
                            (blob) => {
                                if(blob !== null){
                                    rAF.#download_file(blob);
                                }else{
                                    alert("PNG Export Error");
                                }
                                ref.#handle = rAF.#original;
                                ref.#finfo(INFO.CAPTURING,INFO.CAPTURING);
                                ref.#capture = rAF.#no_capture;
                                rAF.#render(ref);
                            },
                            "image/png"
                        );
                    };
                }
            }

            static capture_cancel(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        ref.#replace(null);
                        img?.close();
                        ref.#handle = rAF.#original;
                        ref.#finfo(INFO.CAPTURING,INFO.CAPTURING);
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }
            
            static #download_file(blob){
                let name = 
                    `3D_Image [${new Date().getTime()}].png`;
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = name;
                a.click();
                URL.revokeObjectURL(url);
            }
            
        }

        function init(canvas,info){ 
            keep_wake().then(
            () => {
                return navigator.mediaDevices.getUserMedia(
                    {
                        audio:false,
                        video:{
                            width:{
                                ideal:3840
                            },
                            height:{
                               ideal:2160
                            },
                            facingMode:{
                                exact:"environment"
                            }
                        }
                     }
                 );
            }
        ).then(
                (stream) => maxsize_stream(stream,canvas)
        ).then(
                (tools) => {
                    let c = new rAF(tools,info);
                    let cancel = () => rAF.capture_cancel(c);
                    let finish = () => rAF.capture_other(c,canvas);
                    let capture_left = () => rAF.capture_left(c);
                    let capture_right = () => rAF.capture_right(c);
                    
                    click_main(
                        capture_left,
                        capture_right,
                        finish,
                        cancel
                    );
                    
                    screen.orientation.addEventListener(
                        'change',
                        cancel
                    );
                }
        ).catch(
                (err) => {
                    alert(`Catch the Fatal Error:\n${err}`);
                }
            );

        }

        function maxsize_stream(stream,canvas){
            let track = stream.getVideoTracks()[0];
            let cap = track.getCapabilities();
            let cwidth = cap.width?.max;
            let cheight = cap.height?.max;
            let czoom = cap.zoom?.min;
            if(
                cwidth !== undefined &&
                cheight !== undefined &&
                czoom !== undefined
            ){
                stream.getTracks().forEach(t => t.stop());
                
                return navigator.mediaDevices.getUserMedia(
                    {
                        audio:false,
                        video:{
                            width:{
                                exact: cwidth
                            },
                            height:{
                               exact: cheight
                            },
                            facingMode:{
                                exact:"environment"
                            }
                        }
                    }
                ).then(
                    (stream_full) => {
                        let track_full = stream_full.getVideoTracks()[0];
                        return track_full.applyConstraints(
                            {
                                advanced: [{
                                    zoom: czoom,
                                    whiteBalanceMode: "continuous",
                                    exposureMode: "continuous",
                                    focusMode: "continuous"
                                }]
                            }
                        ).then(
                            () => gpu.of(canvas,cwidth,cheight)
                        ).then(
                            (render) => {
                                let imgc = new ImageCapture(track_full);
                                let draw_2d = direct.draw(render);
                                let draw_3d = dubois.anaglyph(render);
                                return {
                                    gFrame: (f)  => imgc.grabFrame().then(f).catch(
                                        (err) => {
                                            alert(`Cannot Capture an Image from the Camera, due to:\n${err}`);
                                        }
                                    ),
                                    preview_2d: draw_2d,
                                    preview_3d: draw_3d
                                };
                            }
                        );
                    }
                );     
            }else{
                return Promise.reject(
                    "Failed apply constraints to the video stream from camera"
                );
            }
        }

        let lock;
        function keep_wake(){
            return document.body.requestFullscreen().then(
                () => navigator.wakeLock.request('screen')
            ).then(
                (wake_lock) => {
                    lovk = wake_lock;
                }
            );
        }
        function click_main(capture_left,capture_right,finish,cancel){
            let click_once = (f) =>
                document.body.addEventListener(
                    "click",
                    f,
                    {once: true}
                );
            let abstract_click = (left,right,left_after,right_after) =>
                ({clientX}) => {
                    let half = document.documentElement.clientWidth / 2;
                    if(clientX < half){
                        left();
                        click_once(left_after());
                    }else if(clientX > half){
                        right();
                        click_once(right_after());
                    }else{
                        //PASS
                    }
                };
            let click_event = {
                original: abstract_click(
                    capture_left,
                    capture_right,
                    () => click_event.left,
                    () => click_event.right
                ),
                left: abstract_click(
                    cancel,
                    finish,
                    () => click_event.original,
                    () => click_event.original
                ),
                right: abstract_click(
                    finish,
                    cancel,
                    () => click_event.original,
                    () => click_event.original
                )
            };
            click_once(click_event.original);
        }
        
    </script>
    <script src="gpu.js"></script>
    <style>
        canvas,#info{
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
        canvas{
            z-index:1;
            width:100dvw;
            height:100dvh;
            object-fit: contain;
        }
        #info{
            z-index:2;
            pointer-events: none;
            color: white;
            opacity: 0.5;
            font-family: emoji;
            font-weight:bold;
            font-size:1.5rem;
        }
        body{
            background-color: black;
            width:100dvw;
            height:100dvh;
        }
    </style>
</head>
<body 
onload="boot(
    document.getElementById('img_canvas'),
    document.getElementById('info')
)">
    <div id="info"></div>
    <canvas id="img_canvas"></canvas>
</body>
